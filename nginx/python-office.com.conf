# python-office.com Nginx 配置

## HTTP 服务（开发/预览）
```nginx
server {
    listen 80;
    server_name python-office.com www.python-office.com;

    root /var/www/python-office.com;
    index index.html;

    # SPA fallback - 所有路径都返回 index.html（用于 Docusaurus 路由）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # Gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript application/xml;
}
```

## HTTPS 服务（生产）
```nginx
server {
    listen 443 ssl http2;
    server_name python-office.com www.python-office.com;

    ssl_certificate     /etc/nginx/ssl/python-office.com.crt;
    ssl_certificate_key /etc/nginx/ssl/python-office.com.key;

    root /var/www/python-office.com;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript application/xml;
}

# HTTP -> HTTPS 重定向
server {
    listen 80;
    server_name python-office.com www.python-office.com;
    return 301 https://$host$request_uri;
}
```

## 部署步骤

1. 复制此配置到 `/etc/nginx/conf.d/python-office.com.conf`
2. 构建项目：`./scripts/build.sh`（会自动生成静态文件到 `docs-pages/build/`）
3. 上传：`rsync -avz docs-pages/build/ user@server:/var/www/python-office.com/`
4. 重载 Nginx：`nginx -t && nginx -s reload`
5. 申请 HTTPS 证书：使用 Let's Encrypt (`certbot --nginx -d python-office.com`)
